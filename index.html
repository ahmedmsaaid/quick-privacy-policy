<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سياسة الخصوصية والشروط | Quick Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #004d40;
      --primary-light: #e6f6f6;
      --accent: #ff8a1f;
      --bg: #f7fafa;
      --surface: #ffffff;
      --text: #172124;
      --text-muted: #5f6f72;
      --border: #dfecec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    .hero {
      background: linear-gradient(135deg, #004d40 0%, #0a6859 60%, #134e4a 100%);
      color: #fff;
      padding: 2.5rem 1.25rem 3.5rem;
      text-align: center;
      position: relative;
    }

    .hero-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .brand-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 0.4rem;
    }

    .hero p {
      color: rgba(255, 255, 255, 0.86);
      font-size: 0.95rem;
    }

    .container {
      max-width: 860px;
      margin: -2rem auto 3rem;
      padding: 0 1rem;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 77, 64, 0.07);
    }

    .tabs {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1.15rem;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .section-item {
      padding: 1.15rem 1.25rem;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .section-item:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }

    .section-subtitle {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.45rem;
    }

    .section-content {
      font-size: 0.95rem;
      color: var(--text);
      white-space: pre-line;
    }

    .state-box {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 0.85rem;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="lang-bar">
        <button class="lang-btn active" data-lang="ar">العربية</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
      <div class="brand-badge">Quick Delivery • كويك ديليفري</div>
      <h1 id="page-title">سياسة الخصوصية والشروط</h1>
      <p id="page-subtitle">شفافية كاملة حول كيفية جمع واستخدام وحماية بياناتك داخل تطبيق Quick Delivery</p>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div id="policy-tabs" class="tabs" style="display: none;"></div>
      <div id="content-area">
        <div class="state-box">
          <div class="spinner"></div>
          <div id="loading-text">جاري تحميل السياسات من التطبيق...</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer-text">© 2026 Quick Delivery — جميع الحقوق محفوظة</footer>

  <script>
    const API_URL = 'https://quick-service.runasp.net/api/v1/policies';

    const UI_TEXT = {
      ar: {
        dir: 'rtl',
        title: 'سياسة الخصوصية والشروط',
        subtitle: 'شفافية كاملة حول كيفية جمع واستخدام وحماية بياناتك داخل تطبيق Quick Delivery',
        loading: 'جاري تحميل السياسات من التطبيق...',
        allPolicies: 'الكل',
        privacy: 'سياسة الخصوصية',
        terms: 'الشروط والأحكام',
        empty: 'لا توجد بنود سياسة متاحة حالياً.',
        footer: '© 2026 Quick Delivery — جميع الحقوق محفوظة'
      },
      en: {
        dir: 'ltr',
        title: 'Privacy Policy & Terms',
        subtitle: 'Full transparency on how Quick Delivery collects, uses, and protects your data.',
        loading: 'Loading policies from the app...',
        allPolicies: 'All',
        privacy: 'Privacy Policy',
        terms: 'Terms & Conditions',
        empty: 'No policy sections available right now.',
        footer: '© 2026 Quick Delivery — All rights reserved'
      }
    };

    const FALLBACK_SECTIONS = [
      {
        titleAr: 'جمع البيانات واستخدامها',
        contentAr: 'يجمع تطبيق Quick Delivery فقط البيانات اللازمة لتقديم خدمة الطلب والتوصيل، مثل الاسم ورقم الهاتف وعنوان التوصيل والموقع الجغرافي أثناء استخدام التطبيق.',
        titleEn: 'Data Collection & Usage',
        contentEn: 'Quick Delivery collects only the information required to fulfill orders and deliveries, such as your name, phone number, delivery address, and location while using the app.'
      },
      {
        titleAr: 'تتبع الموقع الجغرافي',
        contentAr: 'نستخدم بيانات الموقع لتحديد عنوان التوصيل للعميل ومشاركة موقع المندوب المباشر أثناء تنفيذ الطلب فقط مع إظهار إشعار دائم طوال مدة التتبع.',
        titleEn: 'Location Tracking',
        contentEn: 'Location data is used to set customer delivery addresses and share live courier location exclusively during an active delivery with a persistent foreground notification.'
      },
      {
        titleAr: 'حماية البيانات وحذف الحساب',
        contentAr: 'نحافظ على سرية بياناتك ولا نبيعها لأي طرف ثالث، ويمكنك طلب حذف حسابك وبياناتك في أي وقت من داخل إعدادات التطبيق أو عبر التواصل معنا.',
        titleEn: 'Data Protection & Account Deletion',
        contentEn: 'We protect your personal data and never sell it to third parties. You may delete your account and associated data at any time from the app settings.'
      }
    ];

    let currentLang = 'ar';
    let policyGroups = [];
    let selectedGroupIndex = -1; // -1 means show all

    function pickField(sec, base) {
      if (currentLang === 'en') return sec[base + 'En'] || sec[base + 'Ar'] || sec[base] || '';
      return sec[base + 'Ar'] || sec[base + 'En'] || sec[base] || '';
    }

    function applyLanguage(lang) {
      currentLang = lang;
      const cfg = UI_TEXT[lang] || UI_TEXT.ar;
      document.documentElement.lang = lang;
      document.documentElement.dir = cfg.dir;
      document.getElementById('page-title').textContent = cfg.title;
      document.getElementById('page-subtitle').textContent = cfg.subtitle;
      document.getElementById('footer-text').textContent = cfg.footer;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      renderView();
    }

    function renderView() {
      const cfg = UI_TEXT[currentLang] || UI_TEXT.ar;
      const tabsEl = document.getElementById('policy-tabs');
      const contentEl = document.getElementById('content-area');

      if (policyGroups.length > 1) {
        tabsEl.style.display = 'flex';
        tabsEl.replaceChildren();

        const allBtn = document.createElement('button');
        allBtn.className = 'tab-btn' + (selectedGroupIndex === -1 ? ' active' : '');
        allBtn.textContent = cfg.allPolicies;
        allBtn.onclick = () => { selectedGroupIndex = -1; renderView(); };
        tabsEl.appendChild(allBtn);

        policyGroups.forEach((grp, idx) => {
          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (selectedGroupIndex === idx ? ' active' : '');
          const isPrivacy = (grp.policySections || []).some(s =>
            JSON.stringify(s).toLowerCase().includes('privacy') ||
            JSON.stringify(s).includes('خصوص')
          );
          btn.textContent = isPrivacy ? cfg.privacy : (idx === 0 ? cfg.terms : `${cfg.privacy} #${idx + 1}`);
          btn.onclick = () => { selectedGroupIndex = idx; renderView(); };
          tabsEl.appendChild(btn);
        });
      } else {
        tabsEl.style.display = 'none';
      }

      const sectionsToShow = selectedGroupIndex === -1
        ? policyGroups.flatMap(g => g.policySections || [])
        : (policyGroups[selectedGroupIndex]?.policySections || []);

      contentEl.replaceChildren();

      if (!sectionsToShow.length) {
        const emptyBox = document.createElement('div');
        emptyBox.className = 'state-box';
        emptyBox.textContent = cfg.empty;
        contentEl.appendChild(emptyBox);
        return;
      }

      sectionsToShow.forEach(sec => {
        const item = document.createElement('article');
        item.className = 'section-item';

        const title = pickField(sec, 'title');
        const subTitle = pickField(sec, 'subTitle');
        const content = pickField(sec, 'content');

        if (title) {
          const h2 = document.createElement('h2');
          h2.className = 'section-title';
          h2.textContent = title;
          item.appendChild(h2);
        }

        if (subTitle) {
          const h3 = document.createElement('div');
          h3.className = 'section-subtitle';
          h3.textContent = subTitle;
          item.appendChild(h3);
        }

        if (content) {
          const p = document.createElement('p');
          p.className = 'section-content';
          p.textContent = content;
          item.appendChild(p);
        }

        contentEl.appendChild(item);
      });
    }

    async function loadPolicies() {
      try {
        const res = await fetch(API_URL, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const raw = json?.result ?? json?.data ?? json;

        if (Array.isArray(raw)) {
          policyGroups = raw.filter(g => g && Array.isArray(g.policySections));
        } else if (raw && Array.isArray(raw.policySections)) {
          policyGroups = [raw];
        } else if (Array.isArray(raw?.sections)) {
          policyGroups = [{ policySections: raw.sections }];
        }

        if (!policyGroups.length || !policyGroups.some(g => (g.policySections || []).length > 0)) {
          policyGroups = [{ policySections: FALLBACK_SECTIONS }];
        }
      } catch (e) {
        console.warn('Could not load live policies, using fallback:', e);
        policyGroups = [{ policySections: FALLBACK_SECTIONS }];
      }

      renderView();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    loadPolicies();
  </script>
</body>
</html>
